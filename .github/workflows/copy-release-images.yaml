name: copy-release-images

# One-off: copy three images by digest into the prod registry repo.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type COPY to run
        required: true
        type: string

permissions: {}

concurrency:
  group: copy-release-images
  cancel-in-progress: false

jobs:
  copy:
    if: ${{ inputs.confirm == 'COPY' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v1
        with:
          token_format: access_token
          credentials_json: ${{ secrets.GCP_GKE_GITHUB_ACTIONS_SA_KEY }}

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.GCP_GAR_DOCKER_REGISTRY }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Copy images by digest
        env:
          SRC: ${{ secrets.GCP_GAR_DOCKER_BASE_URL }}
          DST: ${{ secrets.GCP_GAR_DOCKER_BASE_URL_PROD }}
          REG: ${{ secrets.GCP_GAR_DOCKER_REGISTRY }}
          TAG: prod-v3.1.0
        run: |
          set -euo pipefail

          # Mask the whole paths and every piece after the host before any docker call.
          echo "::add-mask::$SRC"
          echo "::add-mask::$DST"
          for base in "$SRC" "$DST"; do
            rest="${base#*/}"
            IFS='/' read -ra pieces <<<"$rest"
            for piece in "${pieces[@]}"; do
              [ -n "$piece" ] && echo "::add-mask::$piece"
            done
          done

          # The prod base URL must live on the same registry host we logged in to.
          reg_host="${REG%%/*}"
          if [ "${SRC%%/*}" != "$reg_host" ] || [ "${DST%%/*}" != "$reg_host" ]; then
            echo "::error::registry host of the source or destination path does not match the logged-in registry host"
            exit 1
          fi

          # digest_of REF: sets D_OUT. rc 0 = found (D_OUT is the digest),
          # 2 = not found, 1 = any other error (D_OUT is stderr).
          digest_of() {
            local err
            err="$(mktemp)"
            if D_OUT="$(docker buildx imagetools inspect "$1" --format '{{.Manifest.Digest}}' 2>"$err")"; then
              rm -f "$err"; return 0
            fi
            if grep -qiE 'not found|MANIFEST_UNKNOWN|NAME_UNKNOWN' "$err"; then
              rm -f "$err"; D_OUT=""; return 2
            fi
            D_OUT="$(cat "$err")"; rm -f "$err"; return 1
          }

          services=(
            "aether sha256:b7ccd9b78494128841c4bf46618e270069b63d30078819df8e01b27555db84b3"
            "aether-audio sha256:436815661589f0608b2e3385a371f7ab8b0699f3b9e76347b02c42d2d08e7a1a"
            "aether-image sha256:074717c2934eb63ddd14d1b2cbde808701c8dd12858b3df918aa962d29fe6de9"
          )

          rows=()
          failed=0
          for entry in "${services[@]}"; do
            svc="${entry%% *}"
            want="${entry##* }"

            rc=0; digest_of "$SRC/$svc@$want" || rc=$?
            if [ "$rc" -eq 2 ]; then
              echo "::error::$svc: source digest not found"; failed=1; rows+=("$svc|$want|NO-SOURCE"); continue
            elif [ "$rc" -ne 0 ]; then
              echo "::error::$svc: source check error: $D_OUT"; failed=1; rows+=("$svc|$want|SRC-CHECK-ERROR"); continue
            fi
            if [ "$D_OUT" != "$want" ]; then
              echo "::error::$svc: source digest mismatch"; failed=1; rows+=("$svc|$want|SOURCE-MISMATCH"); continue
            fi

            rc=0; digest_of "$DST/$svc:$TAG" || rc=$?
            if [ "$rc" -eq 0 ]; then
              if [ "$D_OUT" = "$want" ]; then
                echo "$svc: already at destination, skipping"
                rows+=("$svc|$want|yes (skipped)")
              else
                echo "::error::$svc: destination tag exists with a different digest"
                failed=1; rows+=("$svc|$D_OUT|CONFLICT")
              fi
              continue
            elif [ "$rc" -ne 2 ]; then
              echo "::error::$svc: destination check error: $D_OUT"; failed=1; rows+=("$svc|$want|DST-CHECK-ERROR"); continue
            fi

            if ! docker buildx imagetools create --prefer-index=false --tag "$DST/$svc:$TAG" "$SRC/$svc@$want"; then
              echo "::error::$svc: COPY-FAILED"; failed=1; rows+=("$svc|$want|COPY-FAILED"); continue
            fi

            rc=0; digest_of "$DST/$svc:$TAG" || rc=$?
            got="$D_OUT"; [ "$rc" -eq 0 ] || got="unreadable"
            if [ "$got" = "$want" ]; then
              rows+=("$svc|$got|yes")
            else
              echo "::error::$svc: destination digest differs from source after copy"
              failed=1; rows+=("$svc|$got|NO")
            fi
          done

          {
            echo "| service | digest | match |"
            echo "|---|---|---|"
            for r in "${rows[@]}"; do IFS='|' read -r a b c <<<"$r"; echo "| $a | $b | $c |"; done
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit "$failed"
