name: leakguard
on:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Self-test
        run: python3 scripts/leakguard.py --self-test
      - name: Pull request commits, title, body and branch
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          rc=0
          python3 scripts/leakguard.py --range "$BASE..$HEAD" || rc=1
          printf '%s\n' "$PR_TITLE" | python3 scripts/leakguard.py --text "PR title" || rc=1
          printf '%s\n' "$PR_BODY" | python3 scripts/leakguard.py --text "PR body" || rc=1
          printf '%s\n' "$PR_BRANCH" | python3 scripts/leakguard.py --text "branch name" || rc=1
          exit $rc
      - name: Pushed commits and branch
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          BRANCH: ${{ github.ref_name }}
        run: |
          rc=0
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            python3 scripts/leakguard.py --range -n 1 "$AFTER" || rc=1
          else
            python3 scripts/leakguard.py --range "$BEFORE..$AFTER" || rc=1
          fi
          printf '%s\n' "$BRANCH" | python3 scripts/leakguard.py --text "branch name" || rc=1
          exit $rc
