name: Aether Testing (Dashboard & Widgetbook)

on:
  repository_dispatch:
    types: [trigger-aether-testing-workflow]
  workflow_dispatch:
    inputs:
      env:
        description: target env
        required: true
        default: 'dev'
        type: choice
        options:
        - dev
        - prod
      git-ref:
        description: git ref
        required: true
        default: main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_deploy:
    runs-on: macos-14
    env:
      # Hoisted to the job so the Tailscale dashboard step can gate on it:
      # the `secrets` context is not available in step-level `if:`, but `env` is.
      DASHBOARD_ENV_TAILSCALE: ${{ secrets.DASHBOARD_ENV_TAILSCALE }}
    steps:
      - name: Checkout flutter repo
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.OWNER }}/${{ secrets.REPO_AF }}
          token: ${{ secrets.GH_TOKEN }}
          ref: ${{ github.event.client_payload.git-ref || github.event.inputs.git-ref }}
          path: flutter

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version-file: flutter/pubspec.yaml
          cache: true
      
      - name: Install dependencies
        working-directory: ./flutter
        run: |
          mkdir -p build/ios/SourcePackages build/macos/SourcePackages packages/aether_ui/build/ios/SourcePackages packages/aether_ui/build/macos/SourcePackages && flutter pub get
          # Run build_runner on subpackages that require it
          (cd packages/aether_ui && flutter pub get && dart run build_runner build -d)
          dart run build_runner build -d

      - name: Build Test Dashboard
        working-directory: ./flutter
        env:
          ENV: ${{ github.event.client_payload.env || github.event.inputs.env }}
        run: |
          flutter build web -t lib/main_dashboard.dart --dart-define-from-file=env/dev.json --dart-define=FLUTTER_TEST_AUTH=true --base-href "/dashboard/"
          mkdir -p ../web_combined
          mv build/web ../web_combined/dashboard
          flutter clean

      # Second dashboard build, pointed at a developer machine's local stack
      # exposed over Tailscale (`tailscale serve`) instead of the shared dev-a
      # environment. env/tailscale.json is gitignored in aether_flutter (it
      # names a specific machine), so it is materialised here from a secret.
      # The step is skipped entirely when that secret is absent, so forks and
      # normal runs are unaffected.
      - name: Build Test Dashboard (Tailscale / local machine)
        working-directory: ./flutter
        if: ${{ env.DASHBOARD_ENV_TAILSCALE != '' }}
        run: |
          mkdir -p build/ios/SourcePackages build/macos/SourcePackages packages/aether_ui/build/ios/SourcePackages packages/aether_ui/build/macos/SourcePackages && flutter pub get
          printf '%s' "$DASHBOARD_ENV_TAILSCALE" > env/tailscale.json
          flutter build web -t lib/main_dashboard.dart --dart-define-from-file=env/tailscale.json --dart-define=FLUTTER_TEST_AUTH=true --base-href "/dashboard-local/"
          rm -f env/tailscale.json
          mv build/web ../web_combined/dashboard-local
          flutter clean

      - name: Build Widgetbook
        working-directory: ./flutter
        run: |
          mkdir -p build/ios/SourcePackages build/macos/SourcePackages packages/aether_ui/build/ios/SourcePackages packages/aether_ui/build/macos/SourcePackages && flutter pub get
          flutter build web -t lib/widgetbook.dart --base-href "/widgetbook/" -v
          mv build/web ../web_combined/widgetbook
          
          # Create a simple root index.html to link to both
          cat << 'EOF' > ../web_combined/index.html
          <!DOCTYPE html>
          <html>
          <head><title>Aether Testing</title></head>
          <body style="font-family: sans-serif; padding: 2rem;">
            <h1>Aether Testing</h1>
            <ul>
              <li><a href="/dashboard/">Test Dashboard</a> &mdash; shared dev-a environment</li>
              <li><a href="/dashboard-local/">Test Dashboard (local machine via Tailscale)</a> &mdash; requires you to be on the tailnet</li>
              <li><a href="/widgetbook/">Widgetbook</a></li>
            </ul>
          </body>
          </html>
          EOF

      - name: Deploy to Netlify
        uses: ameya-ff/actions-netlify@ameya
        with:
          publish-dir: './web_combined'
          production-branch: main
          deploy-message: "Deploy Testing Tools from GitHub Actions"
          enable-pull-request-comment: false
          enable-commit-comment: false
          enable-commit-status: false
          owner: ${{ secrets.OWNER }}
          repo: ${{ secrets.REPO_AF }}
          sha: ${{ github.event.client_payload.sha || github.sha }}
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID_AETHER_TESTING }}
        timeout-minutes: 1
