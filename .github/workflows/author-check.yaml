name: author-check
on:
  pull_request:
  push:
permissions:
  contents: read
env:
  ALLOWED: 213752513+ameya-ff@users.noreply.github.com
  ZERO: "0000000000000000000000000000000000000000"
jobs:
  author:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Every new commit has the allowed author and committer email
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          DEFAULT: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            range="$PR_BASE..$PR_HEAD"
          elif [ "$BEFORE" = "$ZERO" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            # new branch: every commit not already on the default branch
            range="origin/$DEFAULT..$AFTER"
          else
            range="$BEFORE..$AFTER"
          fi
          echo "Checking $range"
          bad=0
          while read -r sha ae ce; do
            [ -z "$sha" ] && continue
            if [ "$ae" != "$ALLOWED" ] || [ "$ce" != "$ALLOWED" ]; then
              echo "::error::$sha author <$ae> committer <$ce>: both must be exactly <$ALLOWED>"
              bad=1
            fi
          done < <(git log --format='%H %ae %ce' "$range")
          exit $bad
